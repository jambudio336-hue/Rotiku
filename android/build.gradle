plugins {
id 'com.android.application' version '8.5.2' apply false
}

// PEKALONGAN-404
// Kotlin dependency version alignment

subprojects {
configurations.configureEach {
resolutionStrategy.eachDependency { details ->

        if (details.requested.group == "org.jetbrains.kotlin" &&
            details.requested.name in [
                "kotlin-stdlib",
                "kotlin-stdlib-jdk7",
                "kotlin-stdlib-jdk8"
            ]) {

            details.useVersion "1.8.22"

            details.because(
                "Prevent duplicate Kotlin standard library classes"
            )
        }
    }
}

}
